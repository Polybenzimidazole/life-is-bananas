spring:
  application:
    name: life-is-bananas

  datasource:
    url: jdbc:mysql://${DB_HOST:mariadb-server}:${DB_PORT:3306}/${DB_NAME:life_is_bananas}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:MySQLRootPwd}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  thymeleaf:
    cache: false

logging:
  level:
    be.lifeisbananas: debug
