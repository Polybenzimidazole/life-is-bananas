server:
  port: 8080
  forward-headers-strategy: framework
spring:
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
          max-tokens: 800
    retry:
      max-attempts: 1
  datasource:
    url: jdbc:mysql://localhost:3306/life_is_bananas_api
    username: admin
    password: Admin123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  db-init: false

# Begrens hoe lang een vraag op OpenAI wacht.
spring.http.client:
  factory: simple
  connect-timeout: 5s
  read-timeout: 45s
