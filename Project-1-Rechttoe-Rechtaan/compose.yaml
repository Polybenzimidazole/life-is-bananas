services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: life_is_bananas
      MYSQL_USER: lifeisbananasuser
      MYSQL_PASSWORD: ${DB_PASSWORD:-lifeisbananasuserpw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/life_is_bananas.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
