name: life-is-bananas-deel5

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: life_is_bananas_deel5
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${DEEL5_DB_PASSWORD:-Admin123}
      MYSQL_ROOT_PASSWORD: ${DEEL5_DB_ROOT_PASSWORD:-deel5-local-root}
    volumes:
      - deel5-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" > /dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: "./deel 5 backend"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/life_is_bananas_deel5
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${DEEL5_DB_PASSWORD:-Admin123}
      APP_DB_INIT: "true"
      APP_FRONTEND_URL: http://localhost:${DEEL5_FRONTEND_PORT:-8085}
      APP_ISSUER: http://localhost:${DEEL5_FRONTEND_PORT:-8085}
      APP_ALLOWED_ORIGINS: http://localhost:${DEEL5_FRONTEND_PORT:-8085},http://127.0.0.1:${DEEL5_FRONTEND_PORT:-8085}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_NAME: DEEL5_SESSION
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "127.0.0.1:${DEEL5_BACKEND_PORT:-8084}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: "./deel 5 frontend"
    ports:
      - "127.0.0.1:${DEEL5_FRONTEND_PORT:-8085}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    profiles: [admin]
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:${DEEL5_ADMIN_PORT:-8086}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  deel5-mysql-data:
